# Пример конфига: замените примеры своими источниками.
# Веб-версия читает sources.yaml в корне репозитория (он не попадает в git),
# desktop-версия создаёт свою копию в %APPDATA%\MovieAG и правится на экране «Источники».

# Каталог, по которому результаты источников склеиваются в один тайтл
catalog:
  provider: shikimori
  url: https://shikimori.io

# Порядок сверху вниз задаёт приоритет
sources:
  # Источник с открытым API: токен не нужен
  - id: my-api
    type: api
    url: https://api.example.com

  # Балансер с токеном: значение берётся из переменной окружения
  # (при разработке веб-версии ещё и из dotnet user-secrets)
  - id: my-balancer
    type: balancer
    url: https://balancer.example.com
    token: ${MY_BALANCER_TOKEN}

  # id можно назвать как угодно, если указать adapter: имя адаптера из SourceRegistry.
  # enabled: false выключает источник, не удаляя его из списка
  - id: my-second-source
    adapter: my-adapter
    type: site
    url: https://site.example.com
    enabled: false

# Фильмы: карточки по IMDb ID, метаданные из TMDB
movies:
  # Без токена карточки строятся из полей библиотеки
  catalog:
    url: https://api.themoviedb.org
    imagesUrl: https://image.tmdb.org/t/p/w500
    token: ${TMDB_TOKEN}

  sources:
    # Открытые фильмы и собственные HLS-потоки. Несколько записей с одним imdbId станут вариантами просмотра
    - id: open-movies
      adapter: library
      type: library
      items:
        - imdbId: tt1254207
          name: Большой кролик
          originalName: Big Buck Bunny
          year: 2008
          description: Короткометражный мультфильм Blender Foundation о добродушном кролике и трёх вредных грызунах.
          genres: [Мультфильм, Комедия]
          license: CC BY 3.0
          url: https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8

        - imdbId: tt2285752
          name: Слёзы стали
          originalName: Tears of Steel
          year: 2012
          description: Научно-фантастическая короткометражка Blender Foundation о попытке изменить прошлое ради спасения мира.
          genres: [Фантастика]
          license: CC BY 3.0
          url: https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8

