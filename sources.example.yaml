# Пример конфига: замените примеры своими источниками.
# Веб-версия читает sources.yaml в корне репозитория (он не попадает в git),
# desktop-версия создаёт свою копию в %APPDATA%\MovieAG и правится на экране «Источники».

# Каталог, по которому результаты источников склеиваются в один тайтл
catalog:
  provider: shikimori
  url: https://shikimori.io

# Порядок сверху вниз задаёт приоритет
sources:
  # Источник с открытым API: токен не нужен
  - id: my-api
    type: api
    url: https://api.example.com

  # Балансер с токеном: значение берётся из переменной окружения
  # (при разработке веб-версии ещё и из dotnet user-secrets)
  - id: my-balancer
    type: balancer
    url: https://balancer.example.com
    token: ${MY_BALANCER_TOKEN}

  # id можно назвать как угодно, если указать adapter: имя адаптера из SourceRegistry.
  # enabled: false выключает источник, не удаляя его из списка
  - id: my-second-source
    adapter: my-adapter
    type: site
    url: https://site.example.com
    enabled: false
