services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: movieag
      POSTGRES_USER: movieag
      POSTGRES_PASSWORD: movieag
    ports:
      # Только локально, пароль для разработки. 15432: на 5432 в системе уже работает другой сервер
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieag -d movieag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
